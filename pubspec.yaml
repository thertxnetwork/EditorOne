name: editor
description: "EditorOne - A lightweight, fast code editor for Android with Material Design 3."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  
  # Material Design & UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_colorpicker: ^1.1.0
  
  # File System & Permissions
  file_picker: ^8.1.7
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  path: ^1.9.1
  
  # State Management
  provider: ^6.1.2
  
  # Storage & Persistence
  shared_preferences: ^2.3.5
  
  # Syntax Highlighting
  flutter_highlight: ^0.7.0
  highlight: ^0.7.0
  
  # Code Editor
  flutter_code_editor: ^0.3.5
  
  # JSON handling
  collection: ^1.19.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/icons/
